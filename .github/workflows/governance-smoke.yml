name: Governance smoke (testnet)

# Phase 25, plan 25-03: the one live check of the D-08 path on Ethereum Sepolia and the Snapshot
# testnet hub. A 2-of-2 Safe 1.4.1 owns a freshly registered ENSv2 name, both owners sign the
# space settings as a SafeMessage, and the testnet sequencer must accept them.
#
# Testnet only, run by hand only (workflow_dispatch). No pull_request or push trigger, so a forked
# PR can never reach the secrets. The wallet is a throwaway test wallet whose seed lives only in the
# SYNPRESS_SEED_PHRASE secret; account 0 pays, account 1 only signs.
# Reads: secrets.SYNPRESS_SEED_PHRASE (the one smoke step), secrets.SEPOLIA_RPC_URL (optional; the
# registry's public RPC is the fallback). No artifacts are uploaded.

on:
  workflow_dispatch:
    inputs:
      hat_id:
        description: 'Dotted Hats id the member and proposer strategies check (an existing hat on Ethereum Sepolia)'
        required: false
        default: '3758.1.1'
        type: string

permissions:
  contents: read

concurrency:
  group: governance-smoke
  cancel-in-progress: false

jobs:
  governance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Read the Ethereum Sepolia registry entry
        id: registry
        run: |
          set -euo pipefail
          f=html/modules/custom/localnodes_platform/modules/localnodes_web3/config/install/safe_smart_accounts.network.ethereum_sepolia.yml
          rpc=$(awk '/^rpc_urls:/ {r=1; next} r && /^[[:space:]]*-/ {gsub(/[\047" ]/, "", $2); print $2; exit}' "$f")
          tx=$(awk '/^[[:space:]]*tx_url:/ {v=$2; gsub(/[\047"]/, "", v); print v; exit}' "$f")
          case "$rpc" in https://*) ;; *) echo "registry rpc url not found" >&2; exit 1 ;; esac
          case "$tx" in https://*'{hash}'*) ;; *) echo "registry tx_url not found" >&2; exit 1 ;; esac
          echo "rpc_url=$rpc" >> "$GITHUB_OUTPUT"
          echo "tx_url=$tx" >> "$GITHUB_OUTPUT"

      - name: Install the test package (lockfile only, no install scripts)
        run: npm ci --prefix tests/governance --ignore-scripts

      - name: Live smoke run
        env:
          SMOKE_MNEMONIC: ${{ secrets.SYNPRESS_SEED_PHRASE }}
          SMOKE_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL || steps.registry.outputs.rpc_url }}
          SMOKE_EXPLORER_TX: ${{ steps.registry.outputs.tx_url }}
          SMOKE_HAT_ID: ${{ inputs.hat_id }}
        run: |
          set -o pipefail
          node tests/governance/smoke.mjs --live | tee -a "$GITHUB_STEP_SUMMARY"
