services:
  opensocial:
    image: ghcr.io/localnodes/os-knowledge-garden:${IMAGE_TAG:-latest}  # IMAGE_TAG pins a GHCR sha7 tag per instance (set in the Coolify app env); unset means latest; rollback = set IMAGE_TAG to the previous sha7 (e.g. the March build 8d03591) and redeploy
    pull_policy: always
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-opensocial}
      DB_USER: ${DB_USER:-opensocial}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      DRUPAL_HASH_SALT: ${DRUPAL_HASH_SALT:-generate-random}
      DRUPAL_TRUSTED_HOST_PATTERNS: ${DRUPAL_TRUSTED_HOST_PATTERNS:-}
      DRUPAL_REVERSE_PROXY: "true"
      # Optional override for the proxy network trusted for X-Forwarded-For (CIDR, comma-separated).
      # Empty = this container's own /24 (Traefik's address on the app network), plus Cloudflare's
      # ranges, which are always trusted (html/sites/default/trusted-proxies.php).
      DRUPAL_TRUSTED_PROXIES: ${DRUPAL_TRUSTED_PROXIES:-}
      SOLR_HOST: solr
      SOLR_PORT: 8983
      SOLR_PATH: /solr
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # 'paid' = key from a Cloud project with billing on (AI-SPEC G8). Shown on
      # the status report; demo sites (DEMO_MODULE != none) are exempt.
      GEMINI_KEY_TIER: ${GEMINI_KEY_TIER:-}
      DEMO_MODULE: ${DEMO_MODULE:-localnodes_demo}
      DRUPAL_SITE_NAME: ${DRUPAL_SITE_NAME:-LocalNodes}
      DRUPAL_ADMIN_USER: ${DRUPAL_ADMIN_USER:-admin}
      # Empty (the default) = a random admin password that is never shown; first sign-in is
      # `drush user:login` (docs/SELF-HOST.md). DRUPAL_ADMIN_EMAIL empty = admin@example.com.
      DRUPAL_ADMIN_PASS: ${DRUPAL_ADMIN_PASS:-}
      DRUPAL_ADMIN_EMAIL: ${DRUPAL_ADMIN_EMAIL:-}
      SERVICE_FQDN_OPENSOCIAL: ${SERVICE_FQDN_OPENSOCIAL:-}
      # The address people open, with its scheme (https://community.example.org). drush uses it
      # for links in mail the background worker sends; unset, the entrypoint falls back to
      # https://<first SERVICE_FQDN_OPENSOCIAL entry>, then to http://localhost with a warning.
      SERVICE_URL_OPENSOCIAL: ${SERVICE_URL_OPENSOCIAL:-}
      # Outbound mail. The app's .env only interpolates ${...} references; a variable
      # must be listed here to reach the container. RESEND_API_KEY feeds the SMTP
      # transport (settings.php) and the welcome mail (entrypoint). MAIL_FROM is the
      # sender address for both Drupal's site mail (set at install by localnodes_platform)
      # and the welcome mail. Empty = the localnodes.xyz defaults; provision-instance.yml
      # sets noreply@demo.localnodes.xyz for demo and staging instances.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Organizer provisioning (entrypoint): account, welcome mail, callbacks. Set per sign-up by
      # provision-instance.yml from the private manifest; empty on a manual demo run. Coolify only
      # passes names listed here, so every Phase 23 value is listed (scripts/ops/tests/compose-env.test.sh).
      ORGANIZER_EMAIL: ${ORGANIZER_EMAIL:-}
      ORGANIZER_NAME: ${ORGANIZER_NAME:-}
      SITE_NAME: ${SITE_NAME:-}
      PROVISION_CALLBACK_URL: ${PROVISION_CALLBACK_URL:-}
      # This sign-up's own id and attempt, and its own callback token (a per-provision HMAC). The
      # shared callback secret is deliberately not here: a site that can read its env must not be
      # able to report on any other sign-up (T-23-28).
      PROVISION_ID: ${PROVISION_ID:-}
      PROVISION_ATTEMPT: ${PROVISION_ATTEMPT:-}
      PROVISION_CALLBACK_TOKEN: ${PROVISION_CALLBACK_TOKEN:-}
      STRIPE_SESSION_ID: ${STRIPE_SESSION_ID:-}
      # Page types the organizer confirmed: base64url JSON, decoded by the entrypoint.
      LOCALNODES_TOPIC_TYPES: ${LOCALNODES_TOPIC_TYPES:-}
      LOCALNODES_COMMUNITY_SEED: ${LOCALNODES_COMMUNITY_SEED:-}
      # AI choice (gemini or openrouter). OPENROUTER_API_KEY is an organizer's own key, written
      # write-once by the workflow. OPENROUTER_BASE_URL points the OpenRouter provider at another
      # OpenAI-compatible gateway (runbook only, set per instance). AI_BACKUP_PROVIDER and
      # AI_BACKUP_MODEL name the chat-only failover (settings.php -> localnodes_ai_backup).
      AI_PROVIDER: ${AI_PROVIDER:-}
      # Redeploy only (23-40): "reindex" clears and re-indexes the vectors when switching a live site to OpenRouter.
      AI_PROVIDER_SWITCH: ${AI_PROVIDER_SWITCH:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      AI_BACKUP_PROVIDER: ${AI_BACKUP_PROVIDER:-}
      AI_BACKUP_MODEL: ${AI_BACKUP_MODEL:-}
      # Where "Report a problem" mails go besides the site's own managers (set per instance by the runbook).
      HOST_REPORT_EMAIL: ${HOST_REPORT_EMAIL:-}
      # Optional Web3 stack (entrypoint toggle; settings.php RPC override). Empty/false = off
      WEB3_ENABLED: ${WEB3_ENABLED:-false}
      ETHEREUM_PROVIDER_URL: ${ETHEREUM_PROVIDER_URL:-}
      # SIWE chain the signed message must carry (digits; default 1) and its RPC (contract-wallet
      # detection only). settings.php also derives expected_domain/expected_uri from SERVICE_FQDN_OPENSOCIAL.
      SIWE_CHAIN_ID: ${SIWE_CHAIN_ID:-}
      SIWE_CHAIN_RPC_URL: ${SIWE_CHAIN_RPC_URL:-}
      # Safe network registry RPC overrides (localnodes_web3; settings.php). Empty = the
      # registry entry's default RPC URLs.
      SAFE_RPC_URL_ETHEREUM_SEPOLIA: ${SAFE_RPC_URL_ETHEREUM_SEPOLIA:-}
      SAFE_RPC_URL_BASE_SEPOLIA: ${SAFE_RPC_URL_BASE_SEPOLIA:-}
      # WaaP sign-in (siwe_login_waap; settings.php). Inert unless that module is enabled.
      WAAP_ENVIRONMENT: ${WAAP_ENVIRONMENT:-}
      WALLETCONNECT_PROJECT_ID: ${WALLETCONNECT_PROJECT_ID:-}
      # Recurring cron + search indexing worker (docker/worker-loop.sh, forked by the
      # entrypoint). WORKER_ENABLED=false turns it off; WORKER_INTERVAL is in seconds.
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-60}
      # Gas-sponsor relayer (25-09, D-01): this instance's own relayer container, on the compose
      # network only. gas_sponsor (25-10) reads these in settings.php. The token is the shared
      # bearer; the relayer's private key never reaches this container. No depends_on on
      # purpose: a relayer that is down must not keep the site from starting.
      SPONSOR_RELAYER_URL: ${SPONSOR_RELAYER_URL:-http://gas-sponsor-relayer:8080}
      SPONSOR_RELAYER_TOKEN: ${SPONSOR_RELAYER_TOKEN:-}
      # Fee-account low-balance alert floor in wei. Empty keeps gas_sponsor's own default
      # (NetworkFeeAccountController::DEFAULT_LOW_BALANCE_WEI, 0.02 ETH); settings.php reads
      # it only when it is all digits.
      SPONSOR_RELAYER_LOW_BALANCE_WEI: ${SPONSOR_RELAYER_LOW_BALANCE_WEI:-}
    volumes:
      - opensocial-files:/var/www/html/html/sites/default/files
      - opensocial-private:/var/www/private
    depends_on:
      mariadb: { condition: service_healthy }
      solr: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost/user/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  mariadb:
    # 11.4 LTS: the server makes its own TLS certificate at start, and the app image's 11.x
    # client verifies it through the account's password (zero-configuration TLS), so drush's
    # sql commands (the site export) connect over verified TLS with no certificate files.
    image: mariadb:11.4
    environment:
      # A volume made by an older MariaDB (10.11 before 22.2) is upgraded in place on start.
      MARIADB_AUTO_UPGRADE: "1"
      MYSQL_DATABASE: ${DB_NAME:-opensocial}
      MYSQL_USER: ${DB_USER:-opensocial}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      # 11.x images have no mysqladmin; healthcheck.sh uses the image's own healthcheck account.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  solr:
    build:
      context: ./docker
      dockerfile: Dockerfile.solr
    volumes:
      - solr-data:/var/solr
    environment:
      SOLR_HEAP: 512m
      SOLR_MODULES: analysis-extras
    command: |
      bash -c "
        sleep 2 &&
        if [ ! -d /var/solr/data/drupal ]; then
          solr-precreate drupal /opt/solr/server/solr/configsets/drupal;
        fi &&
        exec solr -f
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/drupal/admin/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:v1.13.2
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # One relayer per community (D-01): it pays gas for sponsored governance transactions from its
  # own key, generated at provisioning (provision-instance.yml) and held only as an env secret
  # of this service. No ports are published (TM-87): the server binds 0.0.0.0 inside the image,
  # so it must stay on the compose network, where only the opensocial service calls it.
  # WEB3_ENABLED is the same variable the opensocial service reads. Off (the default) means the
  # relayer runs keyless: it ignores the key and answers 503 web3_disabled to everything but
  # /healthz (25-05). Funding any relayer with real money is the maintainer's call; nothing here does it.
  # The image is pinned by digest: commit 550c0f2 of github.com/LocalNodes/gas-sponsor-relayer,
  # built and published by that repo's image workflow. To move to a newer build, take the digest
  # from that run's summary, check it with `docker buildx imagetools inspect`, and change it here.
  gas-sponsor-relayer:
    image: ghcr.io/localnodes/gas-sponsor-relayer@sha256:b9361ab86c9838ef2a2dffe10a51d88d397e0b595284625e4276656c918bd476
    environment:
      WEB3_ENABLED: ${WEB3_ENABLED:-false}
      SPONSOR_RELAYER_PRIVATE_KEY: ${SPONSOR_RELAYER_PRIVATE_KEY:-}
      SPONSOR_RELAYER_TOKEN: ${SPONSOR_RELAYER_TOKEN:-}
      SPONSOR_RELAYER_COMMUNITY: ${SERVICE_FQDN_OPENSOCIAL:-}
      # Spend caps in wei (D-19): 0.05 ETH per rolling 24 hours, 0.5 ETH per UTC month.
      SPONSOR_RELAYER_CAP_DAY_WEI: ${SPONSOR_RELAYER_CAP_DAY_WEI:-50000000000000000}
      SPONSOR_RELAYER_CAP_MONTH_WEI: ${SPONSOR_RELAYER_CAP_MONTH_WEI:-500000000000000000}
      # Empty = the public RPC URLs in the relayer's config/networks.json.
      SPONSOR_RELAYER_RPC_URL_11155111: ${SPONSOR_RELAYER_RPC_URL_11155111:-}
      SPONSOR_RELAYER_RPC_URL_84532: ${SPONSOR_RELAYER_RPC_URL_84532:-}
      # The default database is :memory:; keep the sqlite state (registrations, spend ledger,
      # pending sends) on the volume so a redeploy loses nothing.
      SPONSOR_RELAYER_DB: /data/relayer.sqlite
    volumes:
      - relayer-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  opensocial-files:
  opensocial-private:
  mariadb-data:
  solr-data:
  qdrant-data:
  relayer-data:
