# Topic 7: Starting a vegetable patch (Blog, community, Garden Swap and Share)
t7a7b7c7-d7e7-4f7a-b7c7-d7e7f7a70007:
  uuid: t7a7b7c7-d7e7-4f7a-b7c7-d7e7f7a70007
  title: "Starting a vegetable patch: notes for beginners"
  type: topic
  langcode: en
  uid: cc33dd44-ee55-4ff6-6778-89900aa11bb2
  body: >
    <p>Several people at the last swap said they'd love to grow something but don't know where to start. Here's what I tell my nieces.</p>

    <p><strong>Start small.</strong> One big pot or a patch the size of a door is plenty. A small patch you look after beats a big one you give up on.</p>

    <p><strong>Water early and deeply.</strong> Our air is dry and the sun is strong. A long drink in the early morning is better than a splash every evening.</p>

    <p><strong>Shelter from the wind.</strong> A fence, a wall or a row of tall plants on the windy side makes a real difference.</p>

    <p><strong>Pick easy plants.</strong> Cherry tomatoes, beans, squash, kale and herbs like mint and chives forgive a lot of mistakes.</p>

    <p><strong>Ask.</strong> Bring a photo of your patch to the seed and cutting swap and we'll help you choose what to plant.</p>
  field_topic_type: Blog
  image:
  image_alt:
  group: ccdd3344-5566-4778-8990-011223344556
  field_content_visibility: community

# Topic 8: Fix-It Table so far (News, community, Fix-It Table)
t8a8b8c8-d8e8-4f8a-b8c8-d8e8f8a80008:
  uuid: t8a8b8c8-d8e8-4f8a-b8c8-d8e8f8a80008
  title: "The Fix-It Table: what we've learned from our first sessions"
  type: topic
  langcode: en
  uid: dd44ee55-ff66-4778-8990-0aa11bb22cc3
  body: >
    <p>We started the Fix-It Table to keep things out of the landfill. It turned out to be just as much about meeting people.</p>

    <p><strong>What worked:</strong> sitting side by side instead of taking things away to fix. People learn, and they talk while they wait for the glue to dry.</p>

    <p><strong>What surprised us:</strong> the busiest table was sewing, not electronics. Hems, buttons, torn pockets and backpack straps.</p>

    <p><strong>What needs work:</strong> we run out of small parts (fuses, buttons, zip pulls). There's now a jar by the door for anyone who wants to chip in, and Marco is collecting spare parts in a box.</p>

    <p>We'd also like a second person who can sew, so the sewing table doesn't have a queue. If that's you, please say hello.</p>
  field_topic_type: News
  image:
  image_alt:
  group: bbcc2233-4455-4667-7889-900112233445
  field_content_visibility: community

