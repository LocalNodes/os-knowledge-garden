  uuid: t6a6b6c6-d6e6-4f6a-b6c6-d6e6f6a60006
  title: "Where are the good spots to rest on the creek path?"
  type: topic
  langcode: en
  uid: 22334455-6677-4889-90aa-bbccddeeff01
  body: >
    <p>A few of our walkers would like to come along but worry about going an hour without a sit-down. Where are the benches along the creek path, and how far apart are they?</p>

    <p>Here's what I know so far:</p>
    <ul>
    <li>Kingbird Park, by the footbridge: two benches, and the toilets are open in the mornings</li>
    <li>About ten minutes downstream: a low stone wall in the shade</li>
    <li>The café on Kestrel Street at the end, with chairs outside</li>
    </ul>

    <p>Are there others? If you know one, add it below and I'll make a little map for the group, so nobody has to stay home because of the distance.</p>
