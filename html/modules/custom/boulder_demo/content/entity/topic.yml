# Topic 5: What grew in the shared bed (Research, community, Garden Swap and Share)
# AI Coverage: Research topic type
t5a5b5c5-d5e5-4f5a-b5c5-d5e5f5a50005:
  uuid: t5a5b5c5-d5e5-4f5a-b5c5-d5e5f5a50005
  title: "What grew well in our shared bed: a simple record"
  type: topic
  langcode: en
  uid: 11223344-5566-4778-8990-aabbccddeef0
  body: >
    <p><strong>Why we kept a record</strong></p>

    <p>Boulder is dry and sunny, with big swings between day and night, and plenty of seed packets assume a damper place. So we wrote down what we planted in the shared bed behind the hall and how it did, to help the next person decide.</p>

    <p><strong>What we did</strong></p>

    <p>We split the bed into eight squares, planted a different crop in each, and watered everything the same: a long soak twice a week, early in the morning. Mulch (straw from a neighbor's rabbit hutch) went on half the squares.</p>

    <p><strong>What we found</strong></p>

    <p>Mulched squares needed about a third less water. Cherry tomatoes, bush beans, squash and kale did very well. Lettuce bolted fast in full sun, so next time it goes in the shade of the beans. Carrots were small in our hard soil; a deeper bag of compost should help. Sunflowers were the children's favorite and fed the birds after.</p>

    <p><strong>What we'd tell a beginner</strong></p>

    <p>Start with cherry tomatoes and beans, water deeply rather than often, and put something on top of the soil to keep it damp. Ask at the seed swap: someone will have a spare seedling.</p>
  field_topic_type: Research
  image:
  image_alt:
  group: ccdd3344-5566-4778-8990-011223344556
  field_content_visibility: community

