# Topic 1: Welcome (Blog, public, no group) -- LONG for chunking
t1a1b1c1-d1e1-4f1a-b1c1-d1e1f1a10001:
  uuid: t1a1b1c1-d1e1-4f1a-b1c1-d1e1f1a10001
  title: "Welcome! A look around a neighborhood site"
  type: topic
  langcode: en
  uid: 66778899-00aa-4bbc-cdd0-eeff01223344
  body: >
    <p><strong>This is a demo</strong></p>

    <p>Everything here is made up: the people, the groups, the events and the street addresses. Only Boulder and Boulder Creek are real places. It shows what a site like this could look like for your street, your building or your club. Have a look around; nothing you do here can break anything.</p>

    <p><strong>What people do here</strong></p>

    <p>Neighbors use the site to see what's on, say hello, and help each other out. Someone needs a ladder for an afternoon; someone else has one in the garage. A few people want to learn to fix a lamp; a neighbor who is good with wires offers an evening. Once a month there's a get-together at the community hall with tea, cake and one thing to learn, and anyone who lives nearby is welcome.</p>

    <p><strong>The groups</strong></p>

    <p>Boulder Creek Neighbors is the main group and is open to everyone: you can read it without an account. Creek Path Walkers meets for a slow walk and a coffee. Garden Swap and Share is for anyone who grows something, even one tomato on a balcony. The Fix-It Table helps you mend things that are broken. You only see what each group shares with you, and some groups keep their posts to members.</p>

    <p><strong>Getting started</strong></p>

    <p>Open Events to see what's coming up. Pick one that looks friendly and turn up: every event says whether it's free and whether children are welcome. If you join a group, say hello in a short post. You don't need any experience, and you don't need to know anyone.</p>

    <p><strong>The shared fund</strong></p>

    <p>Boulder Creek Neighbors keeps a small shared fund for the hall, the cake and the odd speaker's bus fare. Anyone in the group can suggest how to spend it, the group says yes or no, and everyone can see where the money went. There's an evening about it in the calendar if you're curious.</p>
  field_topic_type: Blog
  image:
  image_alt:
  field_content_visibility: public

# Topic 2: What we've fixed (Blog, community, Fix-It Table)
t2a2b2c2-d2e2-4f2a-b2c2-d2e2f2a20002:
  uuid: t2a2b2c2-d2e2-4f2a-b2c2-d2e2f2a20002
  title: "What we've fixed so far, and what beat us"
  type: topic
  langcode: en
  uid: bb22cc33-dd44-4ee5-5ff6-677889900aa1
  body: >
    <p>A quick count from our first sessions at the Fix-It Table. People brought 41 things. 27 went home working, 6 need a part we've ordered, and 8 beat us.</p>

    <p><strong>Most common fixes:</strong> lamps with a loose wire in the plug, zips that came off one side, chairs with a wobbly leg (wood glue and a clamp overnight), and toasters full of crumbs that stopped the lever catching.</p>

    <p><strong>What beat us:</strong> a coffee machine with a cracked boiler, two phones that need a new battery we can't get, and a radio from the 1960s that we're still hoping to save.</p>

    <p><strong>What surprised us:</strong> most people don't want us to fix it for them. They want to see how, and a lot of them have come back with the next broken thing and fixed it themselves at our table.</p>

    <p>If you're good with a needle, a screwdriver or a soldering iron, we'd love another pair of hands. And if you've never held a screwdriver, that's fine too: come and watch.</p>
  field_topic_type: Blog
  image:
  image_alt:
  group: bbcc2233-4455-4667-7889-900112233445
  field_content_visibility: community

