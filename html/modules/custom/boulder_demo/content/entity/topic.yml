# Topic 4: Idea: a tool shelf (Dialog, community, Boulder Creek Neighbors)
t4a4b4c4-d4e4-4f4a-b4c4-d4e4f4a40004:
  uuid: t4a4b4c4-d4e4-4f4a-b4c4-d4e4f4a40004
  title: "Idea: a shared tool shelf at the hall"
  type: topic
  langcode: en
  uid: 22334455-6677-4889-90aa-bbccddeeff01
  body: >
    <p>Most of us own a drill we use twice a year. What if we kept a shelf of tools at the community hall that anyone in the group could borrow?</p>

    <p><strong>What could go on it:</strong></p>
    <ul>
    <li>A drill and a box of bits</li>
    <li>A ladder (the hall has room for a tall one)</li>
    <li>A sewing machine</li>
    <li>Garden shears and a wheelbarrow</li>
    <li>The two knife-sharpening stones we already have</li>
    </ul>

    <p><strong>How borrowing might work:</strong> write your name in a notebook on the shelf, bring it back within a week. The hall is open whenever there's an event, so that's when you'd pick up and return.</p>

    <p>We'd need a lockable cupboard, which the hall says would cost about $120. We could ask the group to spend that from the shared fund. What do you think? Would you use it, and what would you add?</p>
  field_topic_type: Dialog
