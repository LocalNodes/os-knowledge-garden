  title: "Notes from our knife-sharpening evening"
  type: topic
  langcode: en
  uid: aa11bb22-cc33-4dd4-ee55-ff6677889900
  body: >
    <p>Thank you to everyone who came to the neighbors' evening, and a big welcome to the three people who came for the first time.</p>

    <p><strong>What we learned:</strong> Zara showed us how to sharpen a kitchen knife on a stone. Wet the stone, hold the blade at a slight angle (about the height of two stacked coins under the back of the blade), and push it across in smooth strokes, ten on each side. Test it on a sheet of paper, not your thumb.</p>

    <p><strong>What's next:</strong> the potluck supper, then an evening about digital wallets for anyone curious, then soup and stories. All are in Events.</p>

    <p><strong>The fund:</strong> the hall cost $40 and the two sharpening stones $36. The group now keeps the stones, so anyone can borrow them. Ask Mira.</p>
