  uid: ff667788-9900-4aa1-1bb2-2cc33dd44ee5
  body: >
    <p>I'd like to make a simple map of the useful things around Boulder Creek that newcomers never find out about until someone tells them.</p>

    <p><strong>What could go on it:</strong></p>
    <ul>
    <li>Benches and shady spots on the creek path</li>
    <li>Drinking fountains and public toilets</li>
    <li>Little free libraries and the book swap shelf</li>
    <li>The shared garden and the community hall</li>
    <li>Where to drop off batteries and old paint</li>
    <li>Playgrounds with shade</li>
    </ul>

    <p>You know your own street better than anyone. Reply with anything you'd add, and roughly where it is. I'll draw it up and bring printed copies to the next neighbors' evening.</p>
