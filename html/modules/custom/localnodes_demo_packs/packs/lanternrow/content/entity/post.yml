  field_post: '<p>Welcome to the Willow House group on the Lantern Row Housing Co-op site. This is where the 12 of us keep the house running: the library (minutes, repair log, bylaws, house rules, budget, handbook), house decisions, the repair fund and the everyday chat. If you''re visiting, a few things to try: ask the assistant "Has anyone looked at the back steps?" and see which document it quotes. Open the back-steps decision to see how everyone responded. Say you''re coming to Saturday''s work day. Answer the sofa poll. The fund here uses practice money, not real money.</p>'

