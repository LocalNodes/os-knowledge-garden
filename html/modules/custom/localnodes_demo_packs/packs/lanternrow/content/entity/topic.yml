  uuid: 54eb5317-2acc-4c64-b440-8a63d242f3a7
  title: Rowan House handbook
  type: topic
  langcode: en
  uid: bfc9de5e-e309-4307-a207-9caa5a826eaa
  created: -14 day|09:00
  body: |-
    <p>Welcome to Rowan House. Omar will show you the house, arrange your keys and help you find your cupboard and fridge shelf. Ask Kit about the chore rota. Nell keeps the minutes; Tessa keeps budget notes and receipts. Tell Ben about anything that needs fixing. Ari helps with shared tools. Leah keeps our boiler replacement notes.</p>
    <p>Put house questions in this group. Use the Co-op common room for notices useful to both houses. Read Shared tools: borrowing and returns before taking a co-op tool. Rowan's house records stay members-only unless we choose a particular page to share.</p>
