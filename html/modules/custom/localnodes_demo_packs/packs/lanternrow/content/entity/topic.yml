  body: |-
    <p>Mei took these notes. Ana and Jo came from Willow; Nell and Ari came from Rowan.</p>
    <p>Shared tools. Agreed to put the drill, socket set and pipe wrench together in the courtyard tool cupboard. Jo and Ari will keep the borrowing sheet. The borrowing limit is 48 hours so another house is not left waiting all week.</p>
    <p>Useful records. Each house will choose practical notes it can share. Sharing a page does not open the rest of that house's records.</p>
    <p>House spending. Each house keeps its own budget and spending decisions. Co-op Repairs can help arrange a job; it does not decide how another house spends its money.</p>
    <p>Next time: check how tool borrowing is working and hear what each house wants to share.</p>
  field_topic_type: Reference
