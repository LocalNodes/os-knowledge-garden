e805350e-253e-471a-acf2-d541ad0f5dd6:
  uuid: e805350e-253e-471a-acf2-d541ad0f5dd6
  title: 'Replacing our boiler: notes for another house'
  type: topic
  langcode: en
  uid: bfc9de5e-e309-4307-a207-9caa5a826eaa
  created: -14 day|09:00
  body: |-
    <p>Ellis the heating fitter replaced Rowan's boiler. The total was $4,200, including the boiler, fitting and removal of the old unit. The work took one full day.</p>
    <p>We would ask for the included work to be written down before booking. In particular, check whether the price includes removing the old unit and clearing up. Agree the access time and choose someone to be home while the work is done.</p>
    <p>We shared this page so another house can learn from the job. It contains no other Rowan house business.</p>
  field_topic_type: Reference
