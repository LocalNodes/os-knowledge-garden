  title: Rowan House minutes, 8 September
  type: topic
  langcode: en
  uid: bfc9de5e-e309-4307-a207-9caa5a826eaa
  created: -14 day|09:00
  body: |-
    <p>Nell took these minutes. Present: Nell, Ben, Tessa, Ari, Kit, Leah and Omar. All seven house members were there.</p>
    <p>Quiet workspace. Agreed to try a quiet desk in the front room for six weeks, starting when it is ready. Set aside $240 from the house budget for a used desk and a lamp. Tessa will keep the receipts. Review the trial at a house meeting after the six weeks. These are private house arrangements; do not copy them into the common room or the shared boiler notes.</p>
    <p>Keys. Omar will check that everyone has the keys they need. Tell him privately if a key is missing.</p>
