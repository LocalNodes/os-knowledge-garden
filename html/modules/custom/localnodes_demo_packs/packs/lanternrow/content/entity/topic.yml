  title: 'Repairs across both houses: asking for help'
  type: topic
  langcode: en
  uid: 9070d9de-6644-46ae-8c7e-50716e8dfd84
  created: -14 day|09:00
  body: |-
    <p>For a Willow job, ask Ana. For a Rowan job, ask Ben. For shared tools, ask Jo or Ari. They can bring a job to Co-op Repairs so people from both houses can help with practical work.</p>
    <p>Keep private room details in your own house group. The repairs team only needs the details required to arrange the work. Each house follows its own spending rules and approves its own payments. The team has no shared fund in this demo.</p>
