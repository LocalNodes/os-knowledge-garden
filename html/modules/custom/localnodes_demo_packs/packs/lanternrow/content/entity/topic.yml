    <td>Farah</td>
    </tr>
    <tr>
    <td>Something broken</td>
    <td>Ana, or add it to the Repair log</td>
    </tr>
    <tr>
    <td>House charge, receipts, the fund</td>
    <td>Jo</td>
    </tr>
    <tr>
    <td>Chore rota and swaps</td>
    <td>Liam</td>
    </tr>
    <tr>
    <td>The garden</td>
    <td>Grace</td>
