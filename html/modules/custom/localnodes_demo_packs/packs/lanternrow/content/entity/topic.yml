d294588d-0fc4-4df4-8eb8-c50caa4f1406:
  uuid: d294588d-0fc4-4df4-8eb8-c50caa4f1406
  title: Bylaws
  type: topic
  langcode: en
  uid: 9070d9de-6644-46ae-8c7e-50716e8dfd84
  created: -14 day|09:00
  body: |-
    <p><strong>Bylaws of Willow House, Lantern Row Housing Co-op</strong></p>
    <ol>
    <li>
    <p>Name and purpose. Willow House is one house in Lantern Row Housing Co-op. These bylaws apply to Willow House. The members run the house together and live in it. The house has 12 rooms and up to 12 members. Rowan House has its own house records.</p>
    </li>
    <li>
    <p>Members. A member is someone who lives in the house, has paid the $500 member share, and has been agreed by a house decision. The share is paid back within 60 days of leaving, less anything owed. Each member has one voice in decisions.</p>
    </li>
    <li>
    <p>House charge. Each member pays a monthly house charge, set in the yearly budget. It is due by the 5th of the month. If you are going to be late, tell the treasurer before the 5th, not after.</p>
    </li>
    <li>
    <p>Officers. Each January the house picks a treasurer, a minutes-taker, a keeper of the repair log and three fund approvers. One person can do more than one job. Any of these can be changed by a house decision at any time.</p>
    </li>
    <li>
    <p>House decisions. Most decisions are made on the house site. Any member can propose one. A proposal says what will happen, what it costs if anything, and when it closes.</p>
    </li>
    </ol>
    <p>Each member responds in one of three ways:</p>
    <ul>
    <li>Agree.</li>
    <li>Stand aside. You won't stop it, but you have doubts or don't want to take part. A reason is welcome but not needed.</li>
    <li>Block. You think this would harm the house and should not go ahead. You cannot Block without writing a reason.</li>
    </ul>
    <p>A decision passes when, by the deadline, at least two-thirds of the house has responded (8 of 12 when the house is full), at least one member has agreed, and nobody has blocked.</p>
    <p>Deadlines: 7 days for everyday decisions and money decisions. 14 days for changing these bylaws or the house rules.</p>
    <p>If a decision does not pass, the person who proposed it can change it and bring it back as a new decision. If someone blocks, talk to them first. Most blocks point at something that can be fixed.</p>
    <ol start="6">
    <li>
    <p>The repair fund. The demo fund receives 1,000 PRACTICE once at creation; house charges and spare household money never top it up. Any payment from the fund needs approval from two of the three fund approvers. A payment over 300 PRACTICE also needs a house decision first. The fund should not go below 200 PRACTICE except in an emergency, meaning roof, heating, water, or anything unsafe.</p>
    </li>
    <li>
    <p>Meetings. The house meets once a month. Minutes go in the library. Small things can be agreed at a meeting if two-thirds of the house is there and nobody blocks. Anything else goes on the site.</p>
    </li>
    <li>
    <p>Leaving. Give one month's notice to the treasurer and the house.</p>
    </li>
    <li>
    <p>Changing these bylaws. By house decision, open for 14 days.</p>
    </li>
    </ol>
  field_topic_type: Reference
