3a593310-9622-46f0-9ad2-38d5139a1465:
  uuid: 3a593310-9622-46f0-9ad2-38d5139a1465
  title: House minutes
  type: topic
  langcode: en
  uid: 9070d9de-6644-46ae-8c7e-50716e8dfd84
  created: -14 day|09:00
  body: |-
    <p>House meetings are once a month in the front room. Mei takes the minutes. If something is wrong, add a correction under the meeting, don't edit it.</p>
    <p><strong>12 January</strong></p>
    <p>Present: Sam (chair), Mei (minutes), Ana, Jo, Rosa, Marcus, Grace, Farah, Pete, Liam, Dana. Owen at work.</p>
    <p>Budget. Jo went through the budget for the year (it's in the library as Budget). House charge stays at $725 a month. The household repair allowance stays $700 a month within that fictional budget; none is deposited into the separate practice fund. Agreed.</p>
    <p>Fund approvers. Ana, Jo and Rosa stay on as the three approvers. Any payment from the fund still needs two of the three.</p>
    <p>Bathroom 2 fan. Marcus replaced the extractor fan, $64. Thanks Marcus.</p>
    <p>Fridge. Shelves are labelled now. Please don't move other people's things to make room. Pete asked that the top left shelf stays his. Nobody argued.</p>
    <p>Chores. Liam will redo the rota so nobody has bins two weeks running.</p>
    <p>Next meeting 9 February.</p>
    <p><strong>9 February</strong></p>
    <p>Present: everyone.</p>
    <p>Gutter. The gutter over the kitchen window overflows when it rains hard. Ana has a quote of $40 to clear and refix it. Wait for drier weather, then decide.</p>
    <p>Garden. Grace ordered seeds, $45 from the garden budget. She wants a work day in the yard once it warms up.</p>
    <p>Quiet hours. Reminder that quiet hours start at 10 pm. Owen sleeps late after his shifts, so please go easy on the stairs in the mornings.</p>
    <p>Dana. Dana is moving out at the end of summer. Farah will start showing the small top room to people in the summer.</p>
    <p>Next meeting 12 March.</p>
    <p><strong>12 March</strong></p>
    <p>Present: Sam (chair), Mei (minutes), Ana, Jo, Rosa, Marcus, Grace, Pete, Owen, Dana. Apologies: Farah, Liam.</p>
    <p>Back steps. Two treads are loose. Agreed to get three quotes before the spring meeting. Ana will call round.</p>
    <p>Repair fund. Jo says the practice fund will receive 1,000 PRACTICE once when created, with no later top-ups. Jo asked that we keep at least 200 PRACTICE in it for emergencies; bigger jobs wait for quotes and a house decision rather than future house-charge deposits. Nobody objected.</p>
    <p>Washing machine. Liam left a note: the filter was blocked with a sock again. Please check pockets.</p>
    <p>House site. Sam has set up the Willow House group on the co-op site so house decisions and fund payments can be done there instead of on paper. The library will hold the minutes, Repair log, Bylaws, House rules, Budget and Handbook. Sam will show anyone who wants a hand.</p>
    <p>Next meeting: the spring meeting, date to be set.</p>
  field_topic_type: Reference
