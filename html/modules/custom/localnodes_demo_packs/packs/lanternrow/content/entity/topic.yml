  type: topic
  langcode: en
  uid: 9070d9de-6644-46ae-8c7e-50716e8dfd84
  created: -14 day|09:00
  body: |-
    <p>Our shared cordless drill, socket set and pipe wrench live in the courtyard tool cupboard. Co-op members can borrow them for up to 48 hours (two days). Put your name, the item and its return time on the sheet inside the cupboard. Return everything clean, with all its parts, and cross your name off.</p>
    <p>Ask Jo or Ari to arrange access. Tell them about a broken or missing part before the next person borrows it. This page is public so a visitor can see how our tool library works; borrowing is for co-op members.</p>
