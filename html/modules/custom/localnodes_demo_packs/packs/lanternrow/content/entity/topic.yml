5260c3ba-8ac4-4416-8169-fda493651a5f:
  uuid: 5260c3ba-8ac4-4416-8169-fda493651a5f
  title: 'Joining a house: our first week'
  type: topic
  langcode: en
  uid: 9070d9de-6644-46ae-8c7e-50716e8dfd84
  created: -14 day|09:00
  body: |-
    <p>Ask Farah at Willow House or Omar at Rowan House about a room. Each house decides who joins and explains its own house charge and member share before anyone agrees to move in. Read that house's handbook and ask about anything unclear.</p>
    <p>The house welcome contact arranges keys, shows you shared rooms and helps you find your house group on this site. Read the chore rota together. Both houses use this common room for shared notices and knowledge; the houses keep their private records in their own groups.</p>
    <p>On this demo, Willow lets visitors join its group to try the records. A real house is invitation-only, as Willow's About text explains. Joining a demo group is not an offer of housing.</p>
