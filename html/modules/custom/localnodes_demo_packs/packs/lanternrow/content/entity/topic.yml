2aae2f0d-34f3-46cd-9410-7bed95189877:
  uuid: 2aae2f0d-34f3-46cd-9410-7bed95189877
  title: House rules
  type: topic
  langcode: en
  uid: 9070d9de-6644-46ae-8c7e-50716e8dfd84
  created: -14 day|09:00
  body: |-
    <p>These are the rules we have agreed. They change by house decision, open for 14 days. The guest rule was last changed that way.</p>
    <p><strong>Quiet hours.</strong> 10 pm to 7 am, every night. Keep music and calls in your room, doors closed. Owen sleeps late after shifts, so go easy on the stairs in the mornings.</p>
    <p><strong>Kitchen and fridge.</strong> Wash up the same day. Each person has a labelled fridge shelf; don't move someone else's food to make room. The shelf in the door is shared (milk, butter, sauces). Anything unlabelled on the bottom shelf after a week goes on the side with a note, then out.</p>
    <p><strong>Guests.</strong> A guest can stay up to 7 nights in a row. Post in the stream if a guest is staying more than one night. Longer stays need a house decision. Guests follow quiet hours and wash their own dishes.</p>
    <p><strong>Bikes.</strong> Bikes go in the bike shed, not the hall. The hall has to stay clear.</p>
    <p><strong>Shared rooms.</strong> The front room is for everyone. If you book it for something, post in the stream at least two days ahead.</p>
    <p><strong>Smoking.</strong> Not inside. Outside, away from the windows, and take your ends with you.</p>
    <p><strong>Pets.</strong> No new pets without a house decision.</p>
    <p><strong>Repairs.</strong> Report anything broken to Ana or add it to the Repair log. Under $300, Willow's members of Co-op Repairs can just get it done. Over $300 needs three quotes and a house decision. Payments from the repair fund need two of the three fund approvers.</p>
    <p><strong>How we decide.</strong> House decisions are made by consensus on the site. Each member responds Agree, Stand aside, or Block. A Block needs a written reason. A decision passes when at least two-thirds of the house has responded by the deadline, someone agrees and nobody blocks. Everyday and money decisions are open for 7 days. Changing these rules or the bylaws is open for 14 days.</p>
    <p><strong>Bins.</strong> Bins out on Tuesday night. See the chore rota for whose turn it is.</p>
    <p><strong>Be decent.</strong> If something bothers you, talk to the person first. If that doesn't work, bring it to the monthly meeting.</p>
  field_topic_type: Reference
