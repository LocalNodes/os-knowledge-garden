    <p>Money in and money out match. Nothing is left over on purpose: spare household money stays in the fictional household budget and is not a practice-fund deposit.</p>
    <p><strong>Notes</strong></p>
    <p>Gas and electric are higher in winter and lower in summer. The $1,150 is an average. Jo moves money between months, so don't panic at the January bill.</p>
    <p>Household supplies: Liam buys the big packs once a month. Keep receipts and give them to Jo.</p>
    <p>Garden: $80 a month covers seeds, compost and small tools. Grace keeps the receipts.</p>
    <p><strong>The repair fund</strong></p>
    <p>The practice fund receives 1,000 PRACTICE once at creation and no other outside income. Keep at least 200 PRACTICE for emergencies (roof, heating, water, anything unsafe), as the Bylaws say. The separate $700 monthly household repair allowance and older repair-log costs are fictional household-budget records, not extra practice-fund transfers.</p>
    <p>The practice fund began at 1,000 PRACTICE. The back steps (Hollis the joiner, 600 PRACTICE) leave 400 PRACTICE, above the 200 PRACTICE floor. The job waited for creation and the house decision, not for monthly contributions.</p>
    <p>Expected practice-fund costs; only the back steps have been paid:</p>
    <ul>
    <li>Back steps, $600 (agreed by house decision)</li>
    <li>Gutter over the kitchen window, about $40</li>
    <li>Boiler service, $18</li>
    <li>Small fixes as they come, usually under $100 each</li>
    </ul>
    <p>After the back steps, the quoted gutter work (40 PRACTICE) and boiler service (18 PRACTICE), if later agreed and paid, would leave 342 PRACTICE. Paying the separate pending tap (140 PRACTICE) as well would leave 202 PRACTICE, still above the 200 floor. No future contribution is assumed; Jo will report at each meeting.</p>
