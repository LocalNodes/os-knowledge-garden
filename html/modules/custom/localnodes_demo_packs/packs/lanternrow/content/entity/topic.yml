6603bc81-d8d6-43ca-bb65-c4301a44f93f:
  uuid: 6603bc81-d8d6-43ca-bb65-c4301a44f93f
  title: Handbook
  type: topic
  langcode: en
  uid: 9070d9de-6644-46ae-8c7e-50716e8dfd84
  created: -14 day|09:00
  body: |-
    <p><strong>Welcome to Willow House.</strong> Farah keeps this handbook. If something here is out of date, tell her.</p>
    <p><strong>Moving in</strong></p>
    <p>Farah will meet you on moving day with your keys: front door, back door, your room, and the bike shed. If you lose a key, tell Farah. She holds the spares. Before you move in you pay the $500 member share (you get it back when you leave) and your first month's house charge of $725 to Jo.</p>
    <p>Your room should be clean and empty when you arrive. If anything is broken, tell Ana and it goes in the Repair log, so nobody blames you later.</p>
    <p>You get a labelled shelf in the fridge and a cupboard in the kitchen. Ask Farah which ones are free. The top left fridge shelf is Pete's. It has been Pete's for years.</p>
    <p><strong>Chores</strong></p>
    <p>Liam runs the chore rota. It's on the fridge and changes every Monday. Jobs are: kitchen, bathrooms, hall and stairs, bins, front room. New members start on the rota in their second week.</p>
    <p>Bins go out on Tuesday night. Recycling (blue lid) goes out every other week. The rota says which week. If you can't do your turn, swap with someone and tell Liam.</p>
    <p><strong>Guests</strong></p>
    <p>Guests are welcome. A guest can stay up to 7 nights in a row. If someone is staying more than one night, post it in the stream. Longer stays need a house decision.</p>
    <p><strong>Quiet hours</strong></p>
    <p>10 pm to 7 am, every night. Owen works late shifts and sleeps in, so please go easy on the stairs in the mornings.</p>
    <p><strong>Meetings and decisions</strong></p>
    <p>The house meets once a month in the front room. Sam chairs, Mei takes minutes. Bigger things are decided on the house site: you'll get a notice, and you respond Agree, Stand aside, or Block. If you Block, you write why.</p>
    <p><strong>Who to ask</strong></p>
    <table>
    <thead>
    <tr>
    <th>For</th>
    <th>Ask</th>
    </tr>
    </thead>
