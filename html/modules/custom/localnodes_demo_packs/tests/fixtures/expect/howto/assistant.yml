# Assistant rows for the how-to pages, run on a site by
# scripts/check_demo_pack.php --pack=howto. The member is smoke_two (as). The
# group is empty, so the question is asked site-wide, as a member does from
# the assistant's own page. cites are uuids of the how-to pages, in the order
# of shared/content/entity/howto.yml; must_say are the control names the
# page's steps use plus one phrase of the page's substance (the approval step,
# the audience, the permission, the original passage, the frequency, the confirmation),
# and each row also pins one instruction or limit the page states (the organizer
# approves, check the group, the rights box, the numbered source, Save, the
# group name). must_not_say rules out a promise the page denies, one or more per row. The two refusal rows ask what no how-to page covers: the
# assistant must say it found nothing and cite none of the ten pages.
# expected_words records the sentence in Part 3 of source.md for a reader; the
# judge accepts the product's own fixed no-answer reply.
