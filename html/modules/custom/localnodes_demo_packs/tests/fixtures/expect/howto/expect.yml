# indexed: each of the ten guide pages is tracked and indexed by the site's
# keyword search (social_content) and by the index the assistant reads
# (social_posts). The row fails "<index> not indexed" while an item waits and
# "<index> not tracking" when the index does not hold the page at all. It runs
# in the same --search-only pass as the rows above, so a search that finds
# nothing is told apart from a page that was never indexed.
