# What the shared how-to pages must hold once loaded, and what they leave out.
#
# counts.howto: pages in shared/content/entity/howto.yml, P01 to P10.
# left_out: titles of the two pages the source holds beyond Part 1's P01 to
#   P10 (P11 and P12), which stay withheld, and one line from each body.
counts:
  howto: 10
left_out:
  - id: p11-title
    text: Respond to a decision
  - id: p12-title
    text: See what the fund holds
  - id: p11-body
    text: Choose Cast your vote, follow the confirmation shown and check that your response is recorded.
  - id: p12-body
    text: Choose Refresh balances to request another reading.
# Search rows, run by scripts/check_demo_pack.php --pack=howto --search-only:
# a visitor who searches must not find any of the ten how-to pages, which are
# for signed-in members, and smoke_two (a member) must find the page the row is
# about. Every row forbids all ten titles (hidden_titles); the row's own title
# is the page its control member must find. howto-search-visitor searches by
# words of the page body; each howto-search-pNN row searches by words of its
# own page's title.
search_hidden:
  - id: howto-search-visitor
    as: anonymous
    keys: Request to join
    title: Join a group
    control_as: 5b0c1f3e-0d6a-4c51-9a5e-1f0a2b3c4d02
    hidden_titles: &all_titles
      - Join a group
      - Write a post
      - Add a page or file to the library
      - Ask the assistant and check sources
      - Find an event and respond
      - Answer a quick poll
      - Change which emails you get
      - Leave a group
      - Report a problem
      - Get help
  - id: howto-search-p01
    as: anonymous
    keys: Join a group
    title: Join a group
    control_as: 5b0c1f3e-0d6a-4c51-9a5e-1f0a2b3c4d02
    hidden_titles: *all_titles
  - id: howto-search-p02
    as: anonymous
    keys: Write a post
    title: Write a post
    control_as: 5b0c1f3e-0d6a-4c51-9a5e-1f0a2b3c4d02
    hidden_titles: *all_titles
  - id: howto-search-p03
    as: anonymous
    keys: Add a page or file to the library
    title: Add a page or file to the library
    control_as: 5b0c1f3e-0d6a-4c51-9a5e-1f0a2b3c4d02
    hidden_titles: *all_titles
  - id: howto-search-p04
    as: anonymous
    keys: Ask the assistant and check sources
    title: Ask the assistant and check sources
    control_as: 5b0c1f3e-0d6a-4c51-9a5e-1f0a2b3c4d02
    hidden_titles: *all_titles
  - id: howto-search-p05
    as: anonymous
    keys: Find an event and respond
    title: Find an event and respond
    control_as: 5b0c1f3e-0d6a-4c51-9a5e-1f0a2b3c4d02
    hidden_titles: *all_titles
  - id: howto-search-p06
    as: anonymous
