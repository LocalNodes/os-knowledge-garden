# Every control name the how-to pages P01 to P10 tell a member to choose, and
# where that name is proved to exist.
#
# A row is {id, page, label, check, as, where, control, root, path, line,
# in_copy, why}.
# - page: P01 to P10, in the order of the platform's content/site_guide.yml.
# - label: the name exactly as a member sees it.
# - check: "screen" (the test opens the screen as the account the row names,
#   and a visible, enabled control of the kind the row names must carry the
#   name) or "source" (the code that emits the name must hold it as a string,
#   not in a comment). A name goes in a source row only when the test site
#   cannot show it on any screen.
# - as: for a screen row, anonymous (signed out), member (smoke_two),
#   non_member (smoke_out), organizer (smoke_one) or sitemanager.
# - where: for a screen row, the screen in words; the test maps it to a route.
# - control: for a screen row, the kind of element that carries the name:
#   link, tab (a link among the page's tabs), button (a button that does not
#   submit), submit (a submit button), field (a field label or legend), option,
#   heading or placeholder. A heading, a hidden node or a disabled button never
#   stands in for another kind.
# - within: for a screen row, optional: a CSS selector for the region of the
#   screen that holds the control (a block, a form id). A same-named control
#   outside it, such as a link in a sidebar teaser or the footer, does not
#   count. A row without it matches anywhere on the screen.
# - root, path, line: for a source row, the code root (OS is the Open Social
#   profile, H is this repository, C is html/modules/contrib, Core is
#   html/core), the file under it and the line the builder read. The line is
#   a pointer for a reader, not something the test asserts.
# - in_copy: false only where the page describes a control instead of naming it.
# - why: for a source row, what a test site lacks to show it on a screen.
