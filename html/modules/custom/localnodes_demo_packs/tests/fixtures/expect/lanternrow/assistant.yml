# The guide rows ask the how-to questions inside Willow House. The platform's
# Site guide pages answer them, so they cite those pages; the source names the
# pages by title only, so each must_say is held by a recorded title passage
# (passages.yml) or by the page's how-to passage. The tour page has no
# recorded passage, so no row here asks to be shown around. lr-guide-mixed
# needs the House minutes and a guide page in one answer.
# lr-guide-fund asks what no guide page covers, site-wide. The no-answer reply
# passes; so does an answer that cites only the co-op-wide repairs page (no shared
# fund, each house approves its own payments) or the guide page on asking the
# assistant (it does not carry out payments). No other guide page may be
# cited, so a guide page's steps are never given as payment steps, and
# must_not_claim rules out a claim that the assistant can pay or has paid.
