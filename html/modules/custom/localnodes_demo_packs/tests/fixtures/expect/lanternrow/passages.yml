- id: lr-rules-quiet
  uuid: 2aae2f0d-34f3-46cd-9410-7bed95189877
  field: body
  text: "Quiet hours. 10 pm to 7 am, every night. Keep music and calls in your room, doors closed."
  source_line: 204
- id: lr-rules-guests
  uuid: 2aae2f0d-34f3-46cd-9410-7bed95189877
  field: body
  text: "Guests. A guest can stay up to 7 nights in a row. Post in the stream if a guest is staying more than one night. Longer stays need a house decision."
  source_line: 208
- id: lr-bylaws-pass
  uuid: d294588d-0fc4-4df4-8eb8-c50caa4f1406
  field: body
  text: "A decision passes when, by the deadline, at least two-thirds of the house has responded (8 of 12 when the house is full), at least one member has agreed, and nobody has blocked."
  source_line: 184
- id: lr-bylaws-deadlines
  uuid: d294588d-0fc4-4df4-8eb8-c50caa4f1406
  field: body
  text: "Deadlines: 7 days for everyday decisions and money decisions. 14 days for changing these bylaws or the house rules."
  source_line: 186
- id: lr-bylaws-block
  uuid: d294588d-0fc4-4df4-8eb8-c50caa4f1406
  field: body
  text: "If a decision does not pass, the person who proposed it can change it and bring it back as a new decision. If someone blocks, talk to them first. Most blocks point at something that can be fixed."
  source_line: 188
- id: lr-budget-charge
  uuid: 918c68e1-d040-453a-8e49-7321c3609d83
  field: body
  text: "12 members pay a house charge of $725 a month."
