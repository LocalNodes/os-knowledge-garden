# The Lantern Row Housing Co-op pack's walk: what one ordinary member checks, step by step.
#
# Same format as the smoke pack's walk. In addition:
# walk_heading: the heading of the walk's section for this site, without its
#   leading "## ".
# source_sha256, walk_section_sha256, redactions: how source.md relates to the
#   working files this pack was written from. PHPUnit never reads those files,
#   so scripts/check_pack_source.php (run on a development site, given their paths) checks
#   that the sha256 of the pack source is source_sha256, that the sha256 of the
#   walk section (its heading up to, not including, the next line that is
#   exactly "---", lines joined by a newline, one newline at the end) is
#   walk_section_sha256, and that source.md is the source with each line of
#   `redactions` (line number: replacement) replaced. A unit test checks the
#   copy inside the repository: its length, every replacement, and that no
#   line carries a year, a local path or a planning name.
