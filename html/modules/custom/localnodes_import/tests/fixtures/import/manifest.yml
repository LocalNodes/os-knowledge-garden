# Expected import outcome for every file in files/ (Phase 22, E7 source of
# truth). Written before any importer code (plan 22-04), so the import tests
# check the importer against these rows instead of describing what it does.
#
# Fields per row:
#   file          File name in files/, exactly as submitted.
#   kind          pdf | docx | doc | odt | xlsx
#   expect        imported | not_searchable | duplicate | failed | refused
#                 (not_searchable is imported but left out of "N of M
#                 searchable"; UI-SPEC Part 8 S4 badge "Not searchable")
#   reason        null | scanned_pdf | no_text | unreadable | unsupported_type
#                 (UI-SPEC Copywriting Contract: "Not searchable: scanned
#                 PDF", "Not searchable: no text", "Failed: unreadable file")
#   title         Expected Topic title (D-16): the document's metadata title
#                 when present, else the file name with its extension removed,
#                 underscores and hyphens turned into spaces and the first
#                 letter capitalised. For a duplicate it is the existing
#                 page's title (the report links that page). null where no
#                 Topic is created (failed, refused).
#   phrase        The fixture phrase the searchable Topic's indexed content
#                 must contain, or null. The scanned, encrypted and truncated
#                 PDFs do hold a phrase (heron-11, -12, -13), but it must never
#                 reach the index, so their phrase is null here.
#   duplicate_of  For the byte-identical copy: the file it duplicates.
#
# Decided here (AI-SPEC §5 left it to the planner; RESEARCH Open Question 6):
# the encrypted and the truncated PDF are "failed" with the unreadable-file
# copy, not imported as not searchable. Neither may cause a fatal.
#
# Extractor pinned for PDFs: smalot/pdfparser (ai_file_to_text PdfExtractor).
# If Poppler's pdftotext is on the PATH, ai_file_to_text may prefer it; the
# tests pin smalot (AI-SPEC §5, pitfall 12). Measured by probe_extraction.php.
pdf_extractor: smalot

