# A neighborhood association: one group everyone is in, the community's
# Commons ('{commons}': its name and "Commons"). The block kind is recorded
# for later group creation, with no group template suggested.
# Raise the version whenever the groups or kinds change.
id: neighbourhood_association
version: 2
label: 'Neighborhood association'
description: 'One group for the whole association, and a group for each block.'
groups:
  -
    name: '{commons}'
    visibility: community
    everyone: true
    group_template: null
repeatable:
  -
    kind: block
    label: 'Add a block'
    group_template: null
