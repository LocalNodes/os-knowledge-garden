# LocalNodes brand palette for the socialblue colour scheme (DES-01, D-03).
#
# Source of truth: .planning/phases/22-document-importer-cited-group-answers/
# 22-UI-SPEC.md Part 1, "The 15 socialblue scheme values". All 15 values are
# distinct, as socialblue/color/color.inc requires (drupal/color rewrites
# brand.css by find-and-replace of each stock hex).
#
# Shipped in config/optional so a color.theme.socialblue written earlier in the
# install can never cause a pre-existing-config failure. The stylesheets are
# generated by _localnodes_platform_apply_brand_palette() in
# localnodes_platform.install, which reads this file; drupal/color only
# generates CSS from its form submit handler, never on config import.
#
# Mirrored by css/ln-tokens.css and the Nuxt onboarding app's main.css;
# scripts/check_token_parity.mjs fails if any shared hex differs.
palette:
  brand-primary: '#0f766e'
  brand-secondary: '#134e4a'
  brand-accent: '#fbbf24'
  brand-accent-text: '#343434'
  brand-link: '#115e59'
  navbar-bg: '#27272a'
  navbar-text: '#ffffff'
  navbar-active-bg: '#18181b'
  navbar-active-text: '#f4f4f5'
  navbar-sec-bg: '#0b4d48'
  navbar-sec-text: '#f9f9f9'
  second-line-navbar-bg: '#042f2e'
  second-line-navbar-text: '#fffff1'
  second-line-navbar-active-bg: '#f0fdfa'
  second-line-navbar-active-text: '#0a3f3b'
stylesheets: []
files: []
