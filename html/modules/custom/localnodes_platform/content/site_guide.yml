# Member how-to pages, created on every site by localnodes_platform_install()
# (SiteGuidePages). Text: the member how-to source, kept byte for byte in
# localnodes_demo_packs/tests/fixtures/expect/howto/source.md.
# Part 1 only, P01 to P10; P11 and P12 withheld.
# Each page's body is the source text. Its links are the fixed site paths of
# the screens it describes; the installer adds them as a closing paragraph, so
# the body stays the source word for word. No link holds a group, a person or
# a host name. The installer stamps the owner (the blocked site guide account),
# the Site guide type, community visibility and the basic_html format.
082c2aa7-75a3-4ee1-af7d-2b4fe8e7af08:
  uuid: 082c2aa7-75a3-4ee1-af7d-2b4fe8e7af08
  links:
    - path: /all-groups
      text: All groups
  title: Join a group
  body: >
    <p>Open the group's page from its link or your invitation. Check that it is the group you meant to join.</p>

    <p>If <strong>Join</strong> is offered, choose it and complete the joining confirmation if shown.</p>

    <p>If you see <strong>Request to join</strong>, open it, follow the instructions about a message and choose <strong>Send request</strong>. This asks an organizer for approval; sending a request does not make you a member.</p>

    <p>If you have an invitation, choose <strong>Accept</strong> on that invitation and complete any joining steps shown. If none of these options is available, ask the group's organizers how to join.</p>

b8d8e848-e2a3-4caa-bbca-247fa7e07759:
  uuid: b8d8e848-e2a3-4caa-bbca-247fa7e07759
  links:
    - path: /my-groups
      text: My groups
  title: Write a post
  body: >
    <p>Open your group's <strong>Stream</strong>. Find <strong>Say something to the group</strong> and write your post there. Check the group and the audience shown before you choose <strong>Post</strong>.</p>

    <p>A post is for sharing something with its chosen audience. Avoid putting information there that those people should not see. If you need to add a lasting reference document, use the library instead.</p>

    <p>If the post box is missing or you cannot submit, ask an organizer about your access. You do not have to post to use the site.</p>

41177da8-52b7-47f4-83c3-bff8d4fb3433:
  uuid: 41177da8-52b7-47f4-83c3-bff8d4fb3433
  links:
    - path: /node/add/topic
      text: New Topic
    - path: /my-groups
      text: My groups
  title: Add a page or file to the library
  body: >
    <p>To write a page, choose <strong>New Topic</strong> in the create menu, if available. Write your page, complete the required fields and check its group and audience. Choose <strong>Create topic</strong>.</p>

    <p>To upload a file, open your group's <strong>Import</strong> tab, choose <strong>Upload files</strong>, then <strong>Choose files</strong>. Check <strong>Who can see these pages?</strong> and complete the required fields. Tick the rights box only if you have permission to share the files. Choose <strong>Import 1 file</strong>, or the button showing your file count.</p>

    <p>Use selectable text for assistant answers; it cannot read an image-only scan. A changed file becomes a new document; it does not replace the old one. If these controls are missing, ask an organizer.</p>

f4d742fe-20f6-40ac-b989-6b361efdbf10:
  uuid: f4d742fe-20f6-40ac-b989-6b361efdbf10
  links:
    - path: /my-groups
      text: My groups
  title: Ask the assistant and check sources
  body: >
    <p>On your group's page, open the assistant at the bottom right. It is not shown on the <strong>Import</strong> tab. Ask a question about the library.</p>

    <p>When an answer includes <strong>Sources</strong>, open a numbered source link and check the original passage. Does it support the answer? An answer can be wrong. If no useful source appears, read the documents or ask an organizer.</p>

    <p>Your question and passages used to answer it are sent to the AI service. Preparing pages for search also sends their text to that service, even if you never open the assistant.</p>

    <p>The assistant advises. It does not carry out decisions or payments for you.</p>

83737855-1f79-4c2e-965f-7f8f8e7d350c:
  uuid: 83737855-1f79-4c2e-965f-7f8f8e7d350c
  links:
    - path: /community-events
      text: Events
    - path: /my-events
      text: My events
  title: Find an event and respond
  body: >
    <p>Open your group's <strong>Events</strong>. Choose an event and read its time, place and instructions. <strong>Calendar</strong> gives you a calendar view; <strong>List</strong> takes you back.</p>

    <p>If <strong>Enroll</strong> is available and you want to attend, choose it. If the event offers <strong>Request to enroll</strong>, follow that request instead; a request needs approval. Follow any further instructions shown.</p>

    <p><strong>Enrolled</strong> shows an existing sign-up. If your plans change and <strong>Cancel enrollment</strong> is available, use it.</p>

    <p>Some events have different sign-up arrangements. Follow the event's instructions or ask its organizer if no sign-up action is offered.</p>

ef2613d4-33e2-4712-bdf0-e7c58afbb42c:
  uuid: ef2613d4-33e2-4712-bdf0-e7c58afbb42c
  links:
    - path: /my-groups
      text: My groups
  title: Answer a quick poll
  body: >
    <p>Open <strong>Quick polls</strong> in your group. Choose a question, read the choices, select your answer and choose <strong>Answer</strong>.</p>

    <p>Once you choose <strong>Answer</strong>, your answer stays: a quick poll does not let you take it back or change it, so check your choice first. If offered, <strong>See answers so far</strong> shows the current responses.</p>

    <p>A quick poll checks how members lean. It does not settle a decision for the group. If the question is closed or the answer controls are unavailable, ask the organizer rather than treating it as an unanswered form.</p>

bd9829b7-0e22-423b-ac3c-f4b754f70a63:
  uuid: bd9829b7-0e22-423b-ac3c-f4b754f70a63
  links:
    - path: /my-settings
      text: Settings
  title: Change which emails you get
  body: >
    <p>Open your account menu and choose <strong>Settings</strong>. Find <strong>Email notifications</strong>. For each kind of notification shown, choose the frequency you want, then choose <strong>Save</strong>.</p>

    <p>Choose <strong>Never</strong> for a kind you do not want by email. These choices concern the notifications listed on that form; they do not promise to stop every email about your account or the site.</p>

    <p>If the settings are missing or an email keeps arriving unexpectedly, ask an organizer for help. Describe the kind of email, without forwarding private material unnecessarily.</p>

80647fee-c455-45bb-a191-32bfdf55fca2:
  uuid: 80647fee-c455-45bb-a191-32bfdf55fca2
  links:
    - path: /my-groups
      text: My groups
  title: Leave a group
  body: >
    <p>Open the group's page. Open <strong>Joined</strong>, choose <strong>Leave group</strong>, then confirm with <strong>Leave</strong>.</p>

    <p>Check the group name before confirming. Leaving a group is different from closing your site account. It does not erase the group's records or messages you have already contributed.</p>

    <p>For questions about your own pages, access after leaving or removing records, ask the organizers. If you cannot find the leaving controls, ask them for help.</p>

9e55d601-cbef-4c2e-946c-39503b37941b:
  uuid: 9e55d601-cbef-4c2e-946c-39503b37941b
  links:
    - path: /help
      text: Get help
  title: Report a problem
  body: >
    <p>For a problem with an imported library page, open that page and choose <strong>Report a problem with this page</strong>.</p>

    <p>Choose a reason under <strong>What's the problem?</strong> Use <strong>Details (optional)</strong> to explain what is wrong and where it appears. Add <strong>Your email (optional)</strong> if you would like a reply. Then choose <strong>Send report</strong>.</p>

    <p>Your report goes to the site's organizers and the host. They can see the email address you include. Share only what they need to understand the problem.</p>

    <p>This link is on imported pages. For other content, ask your group's organizers. For a site or sign-in problem, use <strong>Get help</strong>.</p>

f42f8def-e88f-48e5-b194-737527cdeecc:
  uuid: f42f8def-e88f-48e5-b194-737527cdeecc
  links:
    - path: /help
      text: Get help
  title: Get help
  body: >
    <p>Choose <strong>Get help</strong> in the footer. Ask your group's organizers first about group settings, documents or access.</p>

    <p>For a site or sign-in problem, use the email contact shown on that help page. Say what you were trying to do and what happened. Do not send sign-in codes or passwords.</p>

    <p>If someone else got into your account, open <strong>Hacked or phished?</strong> for the account-safety instructions.</p>
