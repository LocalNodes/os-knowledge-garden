# DES-01 design tokens (22-UI-SPEC Part 1): the generated --ln-* custom
# properties (css/ln-tokens.css) and the hand-written AA overrides for
# socialblue, focus ring, reduced motion and chat clearance (css/ln-overrides.css).
# Attached on every socialbase-derived page by localnodes_platform_page_attachments().
# Core puts module CSS in CSS_AGGREGATE_DEFAULT regardless of what is declared
# here, which would load it BEFORE socialblue; localnodes_platform_css_alter()
# moves both files into CSS_AGGREGATE_THEME at weights after socialblue's
# brand--sky.css: ln-tokens.css first (900), then ln-overrides.css (901), then
# the app look, ln-app-look.css (902).
tokens:
  version: VERSION
  css:
    theme:
      css/ln-tokens.css: { weight: 900 }
      css/ln-overrides.css: { weight: 901 }
      css/ln-app-look.css: { weight: 902 }

# A real "More group pages" button for socialblue's group-tab overflow arrow
# (22-30 KB-08): keyboard and screen-reader access to the tabs that don't fit.
group_tabs:
  version: VERSION
  js:
    js/group-tabs.js: {}
  dependencies:
    - core/drupal
    - core/once

# The organizer guide's reading width, 72 characters (23-UI-SPEC section 8,
# Typography; 23-13). No colour in it: colours come from the theme and tokens.
guide:
  version: VERSION
  css:
    theme:
      css/localnodes-guide.css: {}

# The site terms' reading width, 72 characters (23-UI-SPEC section 9, 23-26).
site_terms:
  version: VERSION
  css:
    theme:
      css/localnodes-site-terms.css: {}

# The register form's error summary gets focus after a failed submit
# (23-UI-SPEC section 9 accessibility row, 23-26).
register_error_focus:
  version: VERSION
  js:
    js/register-error-focus.js: {}
  dependencies:
    - core/drupal
    - core/once

site_export:
  css:
    theme:
      css/site-export.css: {}
