services:
  localnodes_platform.private_house_query_subscriber:
    class: Drupal\localnodes_platform\QueryAccess\PrivateHouseQuerySubscriber
    arguments: ['@database', '@entity_type.manager']
    tags:
      - { name: event_subscriber }
  # D-27 (Tom, 2026-11-05; checker W-1): at the ai_usage_limits token
  # ceiling, an index run's embeddings call becomes a SearchApiException, so
  # search_api's cron and post-request catches log it and keep the items
  # tracked. Shared, so its indexing depth is request-scoped.
  localnodes_platform.ai_ceiling_indexing_subscriber:
    class: Drupal\localnodes_platform\EventSubscriber\AiCeilingIndexingSubscriber
    arguments: ['@state', '@config.factory']
    tags:
      - { name: event_subscriber }
  # D-21, ONB-07 (23-10): a chat call that fails with a quota, rate-limit or
  # request error is answered once by the backup model in the
  # localnodes_ai_backup setting, on the same provider only. Never embeddings.
  localnodes_platform.ai_failover_subscriber:
    class: Drupal\localnodes_platform\EventSubscriber\AiFailoverSubscriber
    arguments: ['@?ai.provider', '@logger.factory', '@settings']
    tags:
      - { name: event_subscriber }
  # Runs before core's ReverseProxyMiddleware (priority 300).
  localnodes_platform.cloudflare_client_ip_middleware:
    class: Drupal\localnodes_platform\StackMiddleware\CloudflareClientIpMiddleware
    arguments: ['@settings', '@state', '@datetime.time']
    tags:
      - { name: http_middleware, priority: 310 }
  # B-1 (23-35): unblocks a sign-up site's organizer and sends the welcome mail
  # once, when the sign-up app calls POST /localnodes/activate after the first
  # payment. email_factory is optional only so Kernel tests that enable this
  # module without symfony_mailer still build a container; on a site it is
  # always there (Open Social needs symfony_mailer).
  localnodes_platform.organizer_activation:
    class: Drupal\localnodes_platform\OrganizerActivation
    arguments: ['@state', '@entity_type.manager', '@?email_factory', '@logger.factory', '@lock']
  # Sends a member invited by email on to their invitation after they set
  # their first password. The loader is optional so a site or Kernel test
  # without group invitations still builds a container.
  localnodes_platform.invite_landing:
    class: Drupal\localnodes_platform\InviteLanding
    arguments: ['@?ginvite.invitation_loader']
  # drush localnodes:export writes one
  # archive a community can restore on its own server. key.repository is
  # optional so Kernel tests without the key module still build a container.
  localnodes_platform.site_exporter:
    class: Drupal\localnodes_platform\Export\SiteExporter
    arguments: ['@database', '@config.factory', '@file_system', '@module_handler', '@extension.list.module', '@?key.repository']
  # The export's library/: every published page as Markdown.
  localnodes_platform.library_writer:
    class: Drupal\localnodes_platform\Export\LibraryWriter
    arguments: ['@entity_type.manager', '@request_stack']
  # Watchdog rows keep the page path, not the query string: search and the AI
  # overview carry a member's words in it. Replaces dblog's logger in place.
  localnodes_platform.dblog_without_query:
    class: Drupal\localnodes_platform\Logger\DbLogWithoutQuery
    decorates: logger.dblog
    decoration_on_invalid: ignore
    arguments: ['@.inner']
  # Closes the site while a backup or restore holds the pause file: after the
  # reverse proxy (300), before page cache (200) and session (50).
  localnodes_platform.backup_pause_middleware:
    class: Drupal\localnodes_platform\StackMiddleware\BackupPauseMiddleware
    arguments: ['@settings']
    tags:
      - { name: http_middleware, priority: 250 }
  localnodes_platform.group_notice_cleanup:
    class: Drupal\localnodes_platform\Mail\GroupNoticeCleanup
    arguments: ['@database', '@entity_type.manager', '@localnodes_platform.notice_departures', '@datetime.time']
  localnodes_platform.notice_departures:
    class: Drupal\Core\KeyValueStore\KeyValueStoreInterface
    factory: ['@keyvalue', get]
    arguments: ['localnodes_notice_departures']
  localnodes_platform.notice_mail_config_subscriber:
    class: Drupal\localnodes_platform\EventSubscriber\NoticeMailConfigSubscriber
    tags:
      - { name: event_subscriber }

  localnodes_platform.export_access:
    class: Drupal\localnodes_platform\Export\ExportAccess
    arguments: ['@state', '@entity_type.manager', '@database']
  localnodes_platform.export_identity:
    class: Drupal\localnodes_platform\Export\ExportIdentity
    arguments: ['@localnodes_platform.export_access', '@password', '@flood', '@?localnodes_web3.export_proof']
  localnodes_platform.backup_capture:
    class: Drupal\localnodes_platform\Backup\BackupCapture
  localnodes_platform.export_manager:
    class: Drupal\localnodes_platform\Export\ExportManager
    arguments: ['@database', '@config.factory', '@entity_type.manager', '@localnodes_platform.export_access', '@datetime.time', '@localnodes_platform.site_exporter', '@localnodes_platform.library_writer', '@localnodes_platform.backup_capture', '@logger.factory', '@?email_factory']

  localnodes_platform.export_notice_logger_factory:
    class: Drupal\localnodes_platform\Logger\ExportNoticeLoggerFactory
    decorates: logger.factory
    arguments: ['@.inner']

  localnodes_platform.house_enrollment_access:
    class: Drupal\localnodes_platform\Access\HouseEnrollmentAccess
    arguments: ['@entity_type.manager']
    tags:
      - { name: access_check, applies_to: _localnodes_house_enrollment, method: routeAccess }
  localnodes_platform.house_enrollment_routes:
    class: Drupal\localnodes_platform\Routing\HouseEnrollmentRouteSubscriber
    tags:
      - { name: event_subscriber }
