# LocalNodes visuals for the group fund components: the Test
# network banner and panel left rules and a neutral Short ID, from --ln-*
# tokens only. The generic drupal.org modules never name this library;
# localnodes_web3_library_info_alter() adds it as a dependency of
# safe_smart_accounts/components, so it loads wherever those components do.
treasury:
  version: VERSION
  css:
    theme:
      css/treasury.css: {}
  dependencies:
    - localnodes_platform/tokens

# The sign-in control above the password form and in the welcome block; its
# click goes to the top-bar sign-in (see \Drupal\localnodes_web3\SignIn).
signin:
  version: VERSION
  css:
    theme:
      css/signin.css: {}
  js:
    js/signin.js: {}
  dependencies:
    - core/drupal
    - core/once
    - localnodes_platform/tokens

export_confirmation:
  js:
    js/export-confirmation.js: {}
  dependencies:
    - core/drupal
    - core/once

# "Confirm your sign-in" before a group fund or vote change (see
# ProofRoutes). localnodes_web3_library_info_alter() makes the fund and vote
# modules' scripts depend on it, and adds siwe_login's signer when the
# installed siwe_login has one; localnodes_web3_form_alter() attaches it to
# post forms on pages that need the proof.
signature_proof:
  version: VERSION
  css:
    theme:
      css/signature-proof.css: {}
  js:
    js/signature-proof.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once
    - localnodes_platform/tokens
