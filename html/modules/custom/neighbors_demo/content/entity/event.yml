  type: event
  langcode: en
  uid: ee55ff66-7788-4990-0aa1-1bb22cc33dd4
  body: >
    <p>A relaxed hour for complete beginners. Our group keeps a small shared fund for things like the hall and the cake. We'll show how the money is looked after, who can spend it and how anyone in the group can see where it went, slowly and with plenty of time for questions.</p>

