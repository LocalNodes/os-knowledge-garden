name: 'Neighbors Demo Content'
type: module
description: 'Provides the neighbors demo content: invented neighbors near a creek, with public, community and members-only groups, events dated from install day, posts and a quick poll.'
core_version_requirement: ^9 || ^10
package: LocalNodes
dependencies:
  - social_demo:social_demo
  # The main group's name comes from the platform's Commons rule.
  - localnodes_platform:localnodes_platform
  # Demo content that shows the month calendar and a quick poll; the demo
  # plugins' base classes live in these modules.
  - localnodes_platform:localnodes_events_calendar
  - localnodes_platform:localnodes_quick_poll
