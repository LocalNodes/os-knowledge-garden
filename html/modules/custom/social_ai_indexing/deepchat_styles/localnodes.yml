# LocalNodes DeepChat style (UI-SPEC Part 8 S7, Part 1 tokens).
#
# Every colour here is a token from the UI-SPEC Part 1 table:
#   #0f766e primary (submit button, focus ring)
#   #134e4a primary-strong (submit hover and pressed)
#   #115e59 link
#   #343434 text, #555555 text-muted
#   #8a8a8a border-control (input border), #e6e6e6 divider
#   #ffffff surface, #f3f3f3 canvas (user bubble)
# Selected with style_file: 'module:social_ai_indexing:localnodes.yml'
# (discovered through social_ai_indexing_ai_chatbot_style_modules_alter()).
name: LocalNodes
parameters:
  style: "border-radius: 8px; border: 1px solid #e6e6e6; background-color: #ffffff; color: #343434; font-family: Montserrat, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif; font-size: 16px; line-height: 1.5;"
  messageStyles:
    default:
      shared:
        bubble:
          maxWidth: "100%"
          fontSize: "16px"
          lineHeight: "1.5"
          color: "#343434"
          marginTop: "8px"
          marginBottom: "8px"
      user:
        bubble:
          backgroundColor: "#f3f3f3"
          color: "#343434"
      ai:
        outerContainer:
          backgroundColor: "#ffffff"
          borderTop: "1px solid #e6e6e6"
        bubble:
          backgroundColor: "#ffffff"
          color: "#343434"
    error:
      bubble:
        backgroundColor: "#ffffff"
        color: "#343434"
  textInput:
    placeholder:
      text: "Ask a question"
      style:
        color: "#555555"
    styles:
      container:
        backgroundColor: "#ffffff"
        border: "1px solid #8a8a8a"
        borderRadius: "6px"
        color: "#343434"
      text:
        fontSize: "16px"
        lineHeight: "1.5"
        color: "#343434"
      focus:
        outline: "2px solid #0f766e"
        outlineOffset: "2px"
  avatars:
    default:
      styles:
        position: "left"
  # Injected into DeepChat's shadow root. deepchat-links.js only adds the
  # ln-* classes; every colour and size lives here.
  auxiliaryStyle: |
    @keyframes pulse-color {
      0%   { color: #555555; }
      50%  { color: #8a8a8a; }
      100% { color: #555555; }
    }
    .message-bubble a {
      color: #115e59;
      text-decoration: underline;
    }
    .message-bubble strong {
      font-weight: 600;
    }
    a:focus-visible,
    .input-button:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid #0f766e;
      outline-offset: 2px;
    }
    .message-bubble a.ln-cite {
      padding: 0 4px;
      white-space: nowrap;
    }
    .message-bubble .ln-sources-label {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 0;
    }
    .message-bubble .ln-sources-label strong {
      font-weight: 600;
    }
    .message-bubble .ln-sources {
      margin-top: 4px;
      padding-left: 0;
      list-style: none;
    }
    .message-bubble .ln-sources a {
      display: inline-block;
      min-height: 24px;
      line-height: 24px;
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  submitButtonStyles:
    submit:
      container:
        default:
          backgroundColor: "#0f766e"
          borderRadius: "6px"
        hover:
          backgroundColor: "#134e4a"
        click:
          backgroundColor: "#134e4a"
      svg:
        content: |
          <?xml version="1.0" ?>
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <g>
              <path d="M21.66,12a2,2,0,0,1-1.14,1.81L5.87,20.75A2.08,2.08,0,0,1,5,21a2,2,0,0,1-1.82-2.82L5.46,13H11a1,1,0,0,0,0-2H5.46L3.18,5.87A2,2,0,0,1,5.86,3.25h0l14.65,6.94A2,2,0,0,1,21.66,12Z">
              </path>
            </g>
          </svg>
        styles:
          default:
            width: "1.3em"
            marginTop: "0.15em"
            filter: "brightness(0) invert(1)"
    loading:
      container:
        default:
          backgroundColor: "#ffffff"
      svg:
        styles:
          default:
            filter: "brightness(0) invert(0.34)"
    stop:
      container:
        default:
          backgroundColor: "#ffffff"
        hover:
          backgroundColor: "#f3f3f3"
      svg:
        content: |
          <?xml version="1.0" encoding="utf-8"?>
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="4" ry="4" />
          </svg>
        styles:
          default:
            width: "0.95em"
            marginTop: "0.32em"
            filter: "brightness(0) invert(0.34)"
