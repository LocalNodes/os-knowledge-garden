# LocalNodes DeepChat style (UI-SPEC Part 8 S7, Part 1 tokens).
#
# No colour literal lives here. Every colour is a var(--ln-color-*)
# reference to the token source (localnodes_platform/tokens/localnodes.tokens.json,
# targets.deepchat), so the chat changes with the palette:
#   --ln-color-primary         submit button;  --ln-color-primary-strong  its hover and pressed
#   --ln-color-focus           focus ring;     --ln-color-link            links in a bubble
#   --ln-color-text            text;           --ln-color-text-muted      placeholder, pulse
#   --ln-color-border-control  input border;   --ln-color-divider         hairlines
#   --ln-color-surface         window, bubble; --ln-color-canvas          stop hover
#   --ln-color-raised          question bubble, input
#   --ln-color-cite            [n] chip;       --ln-color-on-cite         its number
# Custom properties inherit into DeepChat's shadow root, so these resolve there
# (checked in a spike). Do not add a hex, rgb() or named colour:
# scripts/tokens/check_raw_colors.mjs fails the build on one.
# The window border is four border-top/right/bottom/left values, not one `border:`:
# a shorthand holding var() reads back empty, and DeepChat then paints its own
# #cacaca border over it (it fills any side whose value is empty).
# Selected with style_file: 'module:social_ai_indexing:localnodes.yml'
# (discovered through social_ai_indexing_ai_chatbot_style_modules_alter()).
name: LocalNodes
parameters:
  style: "border-radius: 8px; border-top: 1px solid var(--ln-color-divider); border-right: 1px solid var(--ln-color-divider); border-bottom: 1px solid var(--ln-color-divider); border-left: 1px solid var(--ln-color-divider); background-color: var(--ln-color-surface); color: var(--ln-color-text); font-family: Montserrat, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif; font-size: 16px; line-height: 1.5;"
  messageStyles:
    default:
      shared:
        bubble:
          maxWidth: "100%"
          fontSize: "16px"
          lineHeight: "1.5"
          color: "var(--ln-color-text)"
          marginTop: "8px"
          marginBottom: "8px"
      user:
        bubble:
          backgroundColor: "var(--ln-color-raised)"
          border: "1px solid var(--ln-color-divider)"
          borderRadius: "12px"
          color: "var(--ln-color-text)"
      ai:
        outerContainer:
          backgroundColor: "var(--ln-color-surface)"
          borderTop: "1px solid var(--ln-color-divider)"
        bubble:
          backgroundColor: "var(--ln-color-surface)"
          color: "var(--ln-color-text)"
    error:
      bubble:
        backgroundColor: "var(--ln-color-surface)"
        color: "var(--ln-color-text)"
  textInput:
    placeholder:
      text: "Ask a question"
      style:
        color: "var(--ln-color-text-muted)"
    styles:
      container:
        backgroundColor: "var(--ln-color-raised)"
        border: "1px solid var(--ln-color-border-control)"
        borderRadius: "8px"
        color: "var(--ln-color-text)"
      text:
        fontSize: "16px"
        lineHeight: "1.5"
        color: "var(--ln-color-text)"
      focus:
        outline: "2px solid var(--ln-color-focus)"
        outlineOffset: "2px"
  avatars:
    default:
      styles:
        position: "left"
  # Injected into DeepChat's shadow root. deepchat-links.js only adds the
  # ln-* classes; every colour and size lives here.
  auxiliaryStyle: |
    @keyframes pulse-color {
      0%   { color: var(--ln-color-text-muted); }
      50%  { color: var(--ln-color-border-control); }
      100% { color: var(--ln-color-text-muted); }
    }
    .message-bubble a {
      color: var(--ln-color-link);
      text-decoration: underline;
    }
    .message-bubble strong {
      font-weight: 600;
    }
    a:focus-visible,
    .input-button:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--ln-color-focus);
      outline-offset: 2px;
    }
    /* The [n] citation: an amber chip, the one place amber is used, where
       an answer meets its source. */
    .message-bubble a.ln-cite {
      display: inline-block;
      min-width: 24px;
      min-height: 24px;
      margin: 0 2px;
      padding: 0 8px;
      border-radius: 999px;
      background-color: var(--ln-color-cite);
      color: var(--ln-color-on-cite);
      font-size: 13px;
      font-weight: 600;
      line-height: 24px;
      text-align: center;
      text-decoration: none;
      white-space: nowrap;
    }
    .message-bubble .ln-sources-label {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 0;
    }
    .message-bubble .ln-sources-label strong {
      font-weight: 600;
    }
    .message-bubble .ln-sources {
      margin-top: 4px;
      padding-left: 0;
      list-style: none;
    }
    .message-bubble .ln-sources a {
      display: inline-block;
      min-height: 24px;
      line-height: 24px;
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  submitButtonStyles:
    submit:
      container:
        default:
          backgroundColor: "var(--ln-color-primary)"
          borderRadius: "6px"
        hover:
          backgroundColor: "var(--ln-color-primary-strong)"
        click:
          backgroundColor: "var(--ln-color-primary-strong)"
      svg:
        content: |
          <?xml version="1.0" ?>
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <g>
              <path d="M21.66,12a2,2,0,0,1-1.14,1.81L5.87,20.75A2.08,2.08,0,0,1,5,21a2,2,0,0,1-1.82-2.82L5.46,13H11a1,1,0,0,0,0-2H5.46L3.18,5.87A2,2,0,0,1,5.86,3.25h0l14.65,6.94A2,2,0,0,1,21.66,12Z">
              </path>
            </g>
          </svg>
        styles:
          default:
            width: "1.3em"
            marginTop: "0.15em"
            filter: "brightness(0) invert(1)"
    loading:
      container:
        default:
          backgroundColor: "var(--ln-color-surface)"
      svg:
        styles:
          default:
            filter: "brightness(0) invert(0.34)"
    stop:
      container:
        default:
          backgroundColor: "var(--ln-color-surface)"
        hover:
          backgroundColor: "var(--ln-color-canvas)"
      svg:
        content: |
          <?xml version="1.0" encoding="utf-8"?>
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="4" ry="4" />
          </svg>
        styles:
          default:
            width: "0.95em"
            marginTop: "0.32em"
            filter: "brightness(0) invert(0.34)"
