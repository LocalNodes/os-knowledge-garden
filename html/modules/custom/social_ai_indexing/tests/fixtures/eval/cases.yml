# Two-source synthesis: the answer must cite BOTH pages (at least two
# numbers), each adding support (citation precision). Facts: Bauwens and
# FLOK/Ecuador come from Commons Transition; the participatory cycle that
# accumulates the commons comes from Commons-Based Peer Production (whose
# opening quote is from the Commons Transition Primer glossary).
- id: RQ-04
