# Governance judge overrides (25-27), on top of the repo's compose file and the nightly's CI override:
#   docker compose -f docker-compose.yaml -f tests/e2e-live/compose.ci.yaml -f tests/e2e-live/compose.governance.yaml \
#     up -d opensocial mariadb solr qdrant gas-sponsor-relayer
# Used only by .github/workflows/governance-judge.yml. Relative paths resolve from the repo root
# (the first file's directory).
#
# The relayer is built from ./.relayer-src, a checkout of the relayer at the commit the workflow's
# inputs name (the TA-5 route; 25-28 fills them). Its published image is never pulled
# (pull_policy: build), so the job runs the exact relayer commit under test.
#
# Values from the job's shell (the compose-up step), never written here:
#   SPONSOR_RELAYER_PRIVATE_KEY_CI  the CI relayer key, a secret of that step only (TM-143)
#   SPONSOR_RELAYER_TOKEN_CI        the bearer both services share, generated by that step
#   SEPOLIA_RPC_URL                 optional; empty means the public URLs in each config
# The judge sets WEB3_ENABLED to "true" for both: otherwise the relayer is keyless and answers
# 503 web3_disabled to everything but /healthz (25-05).
services:
  opensocial:
    environment:
      WEB3_ENABLED: "true"
      SPONSOR_RELAYER_URL: http://gas-sponsor-relayer:8080
      SPONSOR_RELAYER_TOKEN: ${SPONSOR_RELAYER_TOKEN_CI:-}
      # Cron drives the setup, member and carry-out steps (docker/worker-loop.sh); the base 60 s
      # would add minutes to a run.
      WORKER_INTERVAL: "30"
    volumes:
      # The judge's seed only, read by `drush php:script /opt/e2e-live/seed-governance-live.php`.
      - ./tests/e2e-live/seed-governance-live.php:/opt/e2e-live/seed-governance-live.php:ro

  gas-sponsor-relayer:
    image: gas-sponsor-relayer:judge
    pull_policy: build
    build:
      context: ./.relayer-src
    environment:
      WEB3_ENABLED: "true"
      SPONSOR_RELAYER_PRIVATE_KEY: ${SPONSOR_RELAYER_PRIVATE_KEY_CI:-}
      SPONSOR_RELAYER_TOKEN: ${SPONSOR_RELAYER_TOKEN_CI:-}
      # The site's public name, which the owners' registration message is signed with (25-18).
      # The base file reads it from the shell, where the CI job doesn't set it.
      SPONSOR_RELAYER_COMMUNITY: localhost:8080
      SPONSOR_RELAYER_RPC_URL_11155111: ${SEPOLIA_RPC_URL:-}
